<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treatymatrix - Coming Soon</title>
    <style>
        body {
            background: linear-gradient(135deg, #0a264c 0%, #1e1e1e 100%);
            color: white;
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            padding: 20px;
        }
        h1 {
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.2rem;
            color: #a0a0a0;
            max-width: 500px;
        }
        .email-form {
            margin-top: 30px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        input {
            padding: 15px;
            border-radius: 8px;
            border: none;
            width: 250px;
            font-size: 1rem;
        }
        button {
            padding: 15px 30px;
            border-radius: 8px;
            border: none;
            background: #f9a825;
            color: #1e1e1e;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #f5d03d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Treatymatrix</h1>
        <p>AI-Powered LegalTech for Sanctions Compliance & Contract Automation.</p>
        <p>Launching in 2027.</p>
        
        <div class="email-form">
            <input type="email" placeholder="your.email@example.com">
            <button>Notify Me</button>
        </div>
    </div>
</body>
</html>
